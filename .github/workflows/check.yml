name: Reitbuch slot check

on:
  schedule:
    - cron: "*/30 4-20 * * *"   # every 30 min, ~6:00-22:50 Munich time (cron runs in UTC)
  workflow_dispatch:
    inputs:
      debug:
        description: "Send a summary of what the watcher sees to Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: reitbuch-watcher

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check slots
        run: python3 check_slots.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLASS_FILTER: ${{ vars.CLASS_FILTER }}
          WEEKDAYS: ${{ vars.WEEKDAYS }}
          NOTIFY_FREED: ${{ vars.NOTIFY_FREED }}
          DEBUG: ${{ inputs.debug }}

      - name: Save state
        run: |
          git config user.name "slot-bot"
          git config user.email "slot-bot@users.noreply.github.com"
          git add state/events.json
          git diff --cached --quiet || (git commit -m "update slot state" && git push)
